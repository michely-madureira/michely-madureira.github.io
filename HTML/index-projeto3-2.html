<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchConcept LaBelle</title>
    <!-- Favicon -->
    <link rel="shortcut icon" href="../img/logoarch_favicon.png" type="image/x-icon" />
    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- Style -->
    <link rel="stylesheet" href="../CSS/style_proj3-2.css" />
    <!-- Script -->
    <script src="../js/script-projeto3-2.js" defer></script>
</head>
<body>
    <div class="login-container">
        <div class="login-banner">
          <div class="banner-box">
            <h1>Seja bem-vindo</h1>
          </div>
        </div>
        <div class="login-form">
          <div class="logo">
            <a href="../HTML/index-projeto3-1.html">
              <img src="../img/logo2arch.png" alt="Logo">
            </a>
          </div>
          <h2>Crie sua conta:</h2>
          <p>Registre-se para utilizar todas as funcionalidades do sistema</p>
          <div class="data-form">
            <label for="email">Nome</label>
            <input
              type="text"
              name="email"
              id="email"
              placeholder="Digite seu nome"
            />
          </div>
          <div class="data-form">
            <label for="name">E-mail</label>
            <input
              type="text"
              type="name"
              id="name"
              placeholder="Digite seu e-mail"
            />
          </div>
          <div class="data-form">
            <label for="password">Senha</label>
            <input
              type="text"
              type="password"
              id="password"
              placeholder="Digite sua senha"
            />
          </div>
          <p>
            Quer ajuda para criar uma senha segura?
            <span id="open">Clique aqui.</span>
          </p>
          <div id="create-options" class="hide">
            <p>Selecione as ações que você deseja</p>
            <div class="data-form">
              <label for="length">Quantidade de Caracteres:</label>
              <input type="text" id="length" name="length" checked />
            </div>
            <div class="data-form">
              <label for="letters">Letras:</label>
              <input type="checkbox" id="letters" name="letters" checked />
            </div>
            <div class="data-form">
              <label for="numbers">Números:</label>
              <input type="checkbox" id="numbers" name="numbers" checked />
            </div>
            <div class="data-form">
              <label for="symbols">Símbolos:</label>
              <input type="checkbox" id="symbols" name="symbols" checked />
            </div>
            <button id="create-password">Criar senha</button>
          </div>
          <div id="created-password">
            <p>Aqui esta a sua senha</p>
            <h4></h4>
            <button id="copy-password">Copiar</button>
          </div>
          <div class="data-form">
            <label for="confirmpassword">Confirmação de senha</label>
            <input
              type="text"
              type="confirmpassword"
              id="confirmpassword"
              placeholder="Confirme a sua senha"
            />
          </div>
          <input type="submit" value="Cadastrar" />
        </div>
      </div> 
</body>
</html>
