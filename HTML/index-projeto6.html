<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de QR Code</title>
    <!-- Fonte Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <!-- Estilos -->
    <link rel="stylesheet" href="../CSS/style_proj6.css">
    <!-- Scripts -->
    <script src="../js/script-projeto6.js" defer></script>
</head>
<body>
    <div class="container">
       <header id="qr-header">
            <h1>Gerador de QR Code</h1>
            <p>Insira uma URL ou Texto, para criar o QR Code</p>
       </header> 
       <div id="qr-form">
        <input type="text" placeholder="Digite a URL ou Texto">   
        <button>Gerar QR Code</button>
       </div>
       <div id="qr-code">
            <img src="img/qrcode.jpg" alt="QR Code" /> 
       </div>
    </div>
</body>
</html>
